<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDIO RADIO</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:white;text-align:center;padding:20px}
h1{color:#ff2d55;font-size:40px;margin:10px}
.box{background:#222;border-radius:20px;padding:20px;margin:15px auto;max-width:500px}
button{padding:15px 25px;font-size:18px;border:none;border-radius:50px;margin:5px;cursor:pointer}
.onair{background:#ff2d55;color:white}
.play{background:#00c853;color:white}
input{width:90%;padding:12px;border-radius:10px;border:none;margin:5px}
</style>
</head>
<body>
<h1>🎙️ STUDIO RADIO</h1>
<p>LIVE FROM DURBAN</p>

<div class="box">
<h2 id="status">🔴 OFF AIR</h2>
<button class="onair" onclick="goLive()">GO LIVE</button>
<button onclick="stopLive()">STOP</button>
</div>

<div class="box">
<h3>🎵 Now Playing</h3>
<p id="song">No song selected</p>
<input id="songInput" placeholder="Type song name...">
<br>
<button class="play" onclick="playSong()">▶ PLAY SONG</button>
</div>

<div class="box">
<h3>🎤 Shoutouts</h3>
<input id="nameInput" placeholder="Listener name...">
<br>
<button onclick="shoutout()">Send Shoutout</button>
<p id="shout"></p>
</div>

<script>
function goLive(){
  document.getElementById('status').innerHTML='🔴 ON AIR - LIVE!';
  alert('You are LIVE!');
}
function stopLive(){
  document.getElementById('status').innerHTML='⚫ OFF AIR';
}
function playSong(){
  let s=document.getElementById('songInput').value;
  if(s==''){s='Unknown Song'}
  document.getElementById('song').innerHTML='🎵 Playing: '+s;
}
function shoutout(){
  let n=document.getElementById('nameInput').value;
  if(n==''){n='Listener'}
  document.getElementById('shout').innerHTML='🔥 Big shoutout to '+n+'! Thanks for listening!';
}
</script>
</body>
